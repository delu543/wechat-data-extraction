name: regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Inspect hosted Python policy inputs
        run: |
          resolved_python="$(python3 -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          printf 'CI=%s GITHUB_ACTIONS=%s RUNNER_ENVIRONMENT=%s RUNNER_OS=%s\n' \
            "$CI" "$GITHUB_ACTIONS" "$RUNNER_ENVIRONMENT" "$RUNNER_OS"
          printf 'RUNNER_TOOL_CACHE=%s\n' "$RUNNER_TOOL_CACHE"
          stat -f 'python owner=%u mode=%Lp path=%N' "$resolved_python"
          stat -f 'tool-cache owner=%u mode=%Lp path=%N' "$RUNNER_TOOL_CACHE"
      - name: Install runtime dependencies
        run: |
          WECHAT_LOCAL_EXPORT_ALLOW_UNVERIFIED_PYTHON=1 \
          WECHAT_LOCAL_EXPORT_ALLOW_GITHUB_HOSTED_PYTHON=1 \
          WECHAT_LOCAL_EXPORT_PYTHON="$(command -v python3)" \
            ./scripts/setup_runtime_tools.sh
      - name: Run release checks
        run: ./scripts/release_check.sh
